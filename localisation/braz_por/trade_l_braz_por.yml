 TRADE_AUTO_IMPORT: "Importação automática"
 TRADE_AUTO_IMPORT_DESC: "Quando ativada, usa §Hfábricas civis§! automaticamente para importar os recursos estratégicos que estiverem em falta. A importação automática inicia e encerra acordos comerciais para evitar que seus recursos entrem em déficit. O §Hpetróleo§! é importado para cobrir o §Hcombustível§! consumido por nossas forças além do que produzimos. Se a opção §HPriorizar petróleo quando houver escassez de combustível§! estiver marcada e o estoque de combustível cair abaixo de 50%, a importação de petróleo será priorizada e quaisquer fábricas restantes no orçamento também passam a importar petróleo para reabastecê-lo até o máximo.\n\nA importação automática dá preferência primeiramente a parceiros capazes de fornecer tudo o que precisamos, depois a §Hmembros da facção§!, em seguida aos países que conseguirem fornecer a maior quantidade e por último às rotas que não exigem §Hcomboios§!. Caso um parceiro deixe de entregar tudo aquilo pelo que estamos pagando, a importação será reduzida ou substituída quando surgir um parceiro capaz de suprir a diferença.\n\n§gNão é possível gerenciar importações manualmente enquanto a importação automática está ativada.§!\n"
 TRADE_AUTO_IMPORT_BUDGET_DESC: "O número máximo de §Hfábricas civis§! que a importação automática pode gastar.\n\nEsse limite não pode ser aumentado além da quantidade de fábricas que temos disponíveis para o comércio.\n\n§RA importação automática precisa estar ativada para que esse valor possa ser alterado.§!"
