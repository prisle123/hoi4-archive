l_russian:
 operation_SIA_sabotage_indochina_ports: "Диверсия в индокитайских портах"
 operation_SIA_sabotage_indochina_ports_desc: "Тайно отправить подрывников в крупные гавани французского Индокитая и заложить взрывчатку под причалами, кранами и топливными складами. Пускай она остаётся там до начала войны, и тогда порты в одно мгновение взлетят на воздух, пока вражеские корабли не успели выйти в море."
 operation_SIA_sabotage_indochina_ports_potential_tt: "§YВ случае успеха:§! в портах Индокитая (§YАннам§!, §YТонкин§! и §YКамбоджа§!) будут тайно заложены заряды взрывчатки. Они будут сдетонированы, как только мы вступим в войну со владельцем портов, и полностью уничтожат эти морские базы."
 operation_SIA_sabotage_indochina_ports_failed_tt: "§RОперация провалена:§! нашим командам не удалось заложить заряды."
 SIA_plant_indochina_port_charges_tt: "В §Yпортах Индокитая§! тайно заложены заряды взрывчатки. Они будут сдетонированы, как только мы вступим в войну со владельцем портов."
